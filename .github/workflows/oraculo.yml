name: Oráculo DevOps

on:
  push:
  workflow_dispatch:
  schedule:
    # 11h UTC = 8h em Brasília (UTC-3), de segunda a sexta
    - cron: "0 11 * * 1-5"

jobs:
  consultar-oraculo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5
      - name: Instalar o Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Rodar os testes
        run: python test_oraculo.py
      - name: Consultar o oráculo
        run: python oraculo.py >> "$GITHUB_STEP_SUMMARY"
