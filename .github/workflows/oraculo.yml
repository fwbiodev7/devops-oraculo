name: Oráculo DevOps

# QUANDO rodar: a cada push ou pelo botão Run workflow
on:
  push:
  workflow_dispatch:

jobs:
  consultar-oraculo:
    # ONDE rodar: num computador Linux do GitHub
    runs-on: ubuntu-latest
    # O QUE fazer: passos executados em ordem
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5
      - name: Instalar o Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Rodar os testes
        run: python test_oraculo.py
      - name: Consultar o oráculo
        run: python oraculo.py >> "$GITHUB_STEP_SUMMARY"
